server:
  port: 8080

spring:
  application:
    name: testcontainers-mysql-demo
  datasource:
    url: jdbc:mysql://localhost:3306/app_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: demo
    password: demo123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
